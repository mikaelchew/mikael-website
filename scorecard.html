<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Strategic Leader Scorecard — Mikael Chew</title>
  <meta name="description" content="A 7-question diagnostic for direct selling leaders. Find out if you're building a business or a job — and the two fronts capping your growth.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.mikaelchew.com/scorecard.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <meta name="theme-color" content="#141312">
  <style>
    :root{
      --bg:#141312; --card:#1c1a18; --card-2:#222019; --cream:#f5f0e8;
      --muted:#b4ac9e; --faint:#7d766b; --red:#c0392b; --red-soft:#e08a80;
      --green:#7fcfa4; --line:rgba(245,240,232,.12); --line-2:rgba(245,240,232,.22);
      --serif:'Playfair Display',Georgia,serif; --sans:'Inter',-apple-system,system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--sans);
      -webkit-font-smoothing:antialiased;line-height:1.6}
    .top{display:flex;justify-content:center;padding:22px 16px}
    .logo{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.02em;
      color:var(--cream);text-decoration:none}
    .logo span{color:var(--red)}
    .wrap{max-width:600px;margin:0 auto;padding:8px 18px 64px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;min-height:360px}
    h1{font-family:var(--serif);font-weight:700;font-size:27px;line-height:1.2;margin:0 0 10px}
    .lead{color:var(--muted);font-size:16px;margin:0 0 24px}
    .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
    .icon-badge{width:50px;height:50px;border-radius:50%;background:rgba(192,57,43,.14);color:var(--red);
      display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 18px}
    .center{text-align:center}
    .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;margin:10px 0;
      background:var(--card-2);border:1px solid var(--line);border-radius:11px;color:var(--cream);
      font-family:var(--sans);font-size:15.5px;line-height:1.4;cursor:pointer;transition:border-color .12s,background .12s}
    .opt:hover{border-color:var(--red);background:#26231c}
    .opt-n{flex:0 0 24px;height:24px;border-radius:50%;background:rgba(245,240,232,.08);
      color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center}
    .pbar{height:5px;background:rgba(245,240,232,.08);border-radius:5px;margin:0 0 22px;overflow:hidden}
    .pbar > div{height:5px;width:0;background:var(--red);border-radius:5px;transition:width .25s}
    .qmeta{font-size:13px;color:var(--faint);margin:0 0 8px}
    .qtext{font-size:19px;font-weight:600;line-height:1.35;margin:0 0 18px}
    .link{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;
      display:inline-flex;align-items:center;gap:6px;padding:8px 0;font-family:var(--sans)}
    .cta{padding:13px 26px;background:var(--red);color:#fff;border:none;border-radius:10px;
      font-size:15.5px;font-family:var(--sans);cursor:pointer}
    .cta:hover{background:#a83227}
    .score{font-family:var(--serif);font-size:40px;font-weight:700;color:var(--red);line-height:1}
    .meter{height:9px;background:rgba(245,240,232,.08);border-radius:9px;max-width:320px;margin:14px auto 20px;overflow:hidden}
    .meter > div{height:9px;background:var(--red);border-radius:9px}
    .sec-h{font-size:13px;letter-spacing:.04em;font-weight:600;margin:22px 0 4px;display:flex;align-items:center;gap:7px}
    .sec-h.good{color:var(--green)} .sec-h.bad{color:var(--red-soft)}
    .row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
    .row .ri{flex:0 0 20px;font-size:18px;margin-top:1px}
    .row .rd{font-size:14px;font-weight:600;margin:0 0 2px}
    .row .rt{font-size:14px;color:var(--muted);line-height:1.5}
    .capture{background:var(--card-2);border:1px solid var(--line);border-radius:13px;padding:20px;margin:24px 0 0}
    .capture h3{margin:0 0 5px;font-size:16px;font-weight:600;font-family:var(--sans)}
    .capture p{margin:0 0 14px;font-size:14px;color:var(--muted)}
    .field{width:100%;padding:12px 14px;margin:0 0 9px;background:#15130f;border:1px solid var(--line-2);
      border-radius:9px;color:var(--cream);font-size:15px;font-family:var(--sans)}
    .field:focus{outline:none;border-color:var(--red)}
    .frow{display:flex;gap:9px;flex-wrap:wrap}
    .frow .field{flex:1;min-width:150px;margin:0}
    .note{font-size:13px;color:var(--faint);margin:10px 0 0;line-height:1.5}
    .ok{display:flex;gap:10px;color:var(--green);font-size:14.5px;line-height:1.55}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
    .chip{font-size:13px;padding:6px 13px;border-radius:8px;background:rgba(192,57,43,.14);color:var(--red-soft)}
    .foot{text-align:center;color:var(--faint);font-size:12.5px;padding:8px 16px 30px}
    .foot a{color:var(--muted)}
    @media(max-width:520px){.card{padding:24px 18px}h1{font-size:24px}}
  </style>
</head>
<body>
  <header class="top"><a class="logo" href="index.html">MIKAEL<span>CHEW</span></a></header>
  <main class="wrap">
    <div class="card" id="sc">
      <noscript><p class="lead">This scorecard needs JavaScript enabled.</p></noscript>
    </div>
  </main>
  <footer class="foot">© Mikael Chew · <a href="index.html">mikaelchew.com</a></footer>

  <script>
  (function(){
    /* ============================================================
       PASTE your deployed Google Apps Script Web App URL here.
       Leave "" to run in DEMO mode (form works, nothing is saved).
       See scorecard-setup/SETUP.md, step 2.
       ============================================================ */
    var ENDPOINT = "";

    var Q=[
     {q:"When you step away for two weeks, your team's production…",dim:"Duplication",g:"Your business leans on you. Until production survives your absence, you own a job, not an asset.",s:"Your team holds when you step back — the mark of real duplication.",o:[["Collapses",1],["Drops noticeably",2],["Holds steady",3],["Keeps growing without me",4]]},
     {q:"A new person joins today. The first 72 hours…",dim:"The first 72 hours",g:"New people join into a vacuum. The first 72 hours decide who stays, and right now they're left to chance.",s:"You run a deliberate first 72 hours. That's why your people stick.",o:[["I hope they stay active",1],["I check in when I can",2],["I have a rough routine",3],["A deliberate onboarding system kicks in",4]]},
     {q:"Most of your group's volume comes from…",dim:"Leverage",g:"Volume is concentrated in you. That's a ceiling, not a foundation.",s:"Your volume comes from builders, not just you. That leverage compounds.",o:[["Me, personally",1],["Me and one or two others",2],["A handful of active builders",3],["Leaders who build their own leaders",4]]},
     {q:"Most of your working hours go to…",dim:"Where your time goes",g:"Your hours go to doing, not developing. Busy isn't the same as strategic.",s:"You spend your time developing leaders — the highest-return work there is.",o:[["Prospecting and selling myself",1],["Putting out fires",2],["A mix of doing and developing",3],["Developing leaders and strategy",4]]},
     {q:"With a new prospect, you mostly…",dim:"How you recruit",g:"You're presenting when you should be diagnosing. People commit when they feel heard, not pitched.",s:"You listen before you guide. That's why the right people say yes.",o:[["Present the plan and products",1],["Share my own story",2],["Ask a few questions first",3],["Listen, diagnose, then guide",4]]},
     {q:"When someone on your team quits, you…",dim:"Retention",g:"Attrition is catching you by surprise. The signs show up earlier than you think.",s:"You read the warning signs and act early. That's how you beat the two-year wall.",o:[["Usually don't see it coming",1],["Find out after they're gone",2],["Sense it but react late",3],["Track the signs and act early",4]]},
     {q:"If the compensation plan vanished tomorrow, your team would…",dim:"Real customers",g:"If the plan disappeared, so would your volume. You're renting customers, not keeping them.",s:"Your team uses the product for real — a business that survives a comp-plan change.",o:[["I honestly don't know",1],["Mostly stop buying",2],["Some would keep using the product",3],["Keep using it — they're real customers",4]]}
    ];
    var ans=[],step=-1,root=document.getElementById('sc');
    function tier(t){
      if(t<=14)return{n:"The Busy Operator",d:"You're working hard — but the business runs on you. The fix isn't more effort. It's a system that duplicates without you.",a:"Start here: the essay “Why Most Leaders Are Busy, Not Strategic.”"};
      if(t<=21)return{n:"The Emerging Strategist",d:"You've built real momentum and some depth. A couple of fronts are quietly capping your growth — close those and the curve bends.",a:"Your next step: Chapter 1 of the book — the full system, free."};
      return{n:"The Strategic Leader",d:"You think in systems and build leaders, not followers. Your edge now is scale — expanding without losing what makes it work.",a:"You're ready for 1:1 strategic work. See Work With Me."};
    }
    function esc(s){return String(s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
    function bar(){var p=step<0?0:Math.round(step/Q.length*100);return '<div class="pbar"><div style="width:'+p+'%"></div></div>';}
    function render(){
      if(step===-1){
        root.innerHTML='<div class="center"><div class="icon-badge">◎</div>'
         +'<p class="eyebrow">The Strategic Leader Scorecard</p>'
         +'<h1>Are you building a business, or a job?</h1>'
         +'<p class="lead">Seven questions. Sixty seconds. Get a front-by-front read on what’s working and what’s capping your growth.</p>'
         +'<button class="cta" id="go">Start the scorecard</button></div>';
        document.getElementById('go').onclick=function(){step=0;render();};return;
      }
      if(step<Q.length){
        var it=Q[step],h=bar()+'<div class="qmeta">Question '+(step+1)+' of '+Q.length+'</div><div class="qtext">'+it.q+'</div>';
        it.o.forEach(function(op,i){h+='<button class="opt" data-s="'+op[1]+'"><span class="opt-n">'+(i+1)+'</span>'+op[0]+'</button>';});
        if(step>0)h+='<button class="link" id="back">← Back</button>';
        root.innerHTML=h;
        Array.prototype.forEach.call(root.querySelectorAll('.opt'),function(b){b.onclick=function(){ans[step]=+b.getAttribute('data-s');step++;render();};});
        var bk=document.getElementById('back');if(bk)bk.onclick=function(){step--;render();};
        return;
      }
      var total=ans.reduce(function(a,b){return a+b;},0),T=tier(total),str=[],gap=[];
      Q.forEach(function(q,i){(ans[i]>=3?str:gap).push({dim:q.dim,msg:ans[i]>=3?q.s:q.g});});
      function list(arr,icon){return arr.map(function(x){return '<div class="row"><span class="ri">'+icon+'</span><div><div class="rd">'+x.dim+'</div><div class="rt">'+x.msg+'</div></div></div>';}).join('');}
      root.innerHTML='<div class="center"><p class="eyebrow">Your profile</p><h1 style="margin-bottom:6px">'+T.n+'</h1>'
        +'<div class="score">'+total+'<span style="font-family:var(--sans);font-size:16px;color:var(--faint);font-weight:400"> / 28</span></div>'
        +'<div class="meter"><div style="width:'+Math.round(total/28*100)+'%"></div></div>'
        +'<p class="lead" style="max-width:460px;margin:0 auto 4px">'+T.d+'</p></div>'
        +(str.length?'<div class="sec-h good">✓ What’s working ('+str.length+')</div>'+list(str,'✓'):'')
        +(gap.length?'<div class="sec-h bad">⚠ Where to focus first ('+gap.length+')</div>'+list(gap,'⚠'):'')
        +'<div class="capture" id="cap"><h3>Get your full breakdown</h3>'
         +'<p>'+T.a+' Leave your name and email and I’ll send your scored profile plus a 3-step plan built for these exact answers.</p>'
         +'<input class="field" id="nm" type="text" placeholder="Your name" autocomplete="name">'
         +'<div class="frow"><input class="field" id="em" type="email" placeholder="name@email.com" autocomplete="email"><button class="cta" id="send">Send my plan</button></div>'
         +'<p class="note" id="note"></p></div>'
        +'<div class="center"><button class="link" id="again">↻ Retake</button></div>';
      var payload={
        type:"scorecard", profile:T.n, score:total,
        answers:Q.map(function(q,i){var lab="";q.o.forEach(function(o){if(o[1]===ans[i])lab=o[0];});return{front:q.dim,answer:lab,score:ans[i]};}),
        strengths:str.map(function(x){return x.dim;}), gaps:gap.map(function(x){return x.dim;}),
        page:location.href
      };
      document.getElementById('send').onclick=function(){submit(payload,T);};
      document.getElementById('again').onclick=function(){ans=[];step=-1;render();};
    }
    function submit(payload,T){
      var nm=document.getElementById('nm').value.trim(), em=document.getElementById('em').value.trim();
      var note=document.getElementById('note');
      if(!nm||em.indexOf('@')<1){note.textContent="Please add your name and a valid email.";return;}
      var btn=document.getElementById('send');btn.disabled=true;btn.textContent="Sending…";
      var body=JSON.stringify(Object.assign({name:nm,email:em,submittedAt:new Date().toISOString()},payload));
      function done(){document.getElementById('cap').innerHTML='<div class="ok"><span style="font-size:18px">✓</span><span>Thanks, '+esc(nm)+' — your plan is on its way. Watch your inbox.</span></div>';}
      if(!ENDPOINT){ console.log("DEMO submission:",body); done(); return; }
      fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body})
        .then(function(r){return r.json();}).then(function(res){ if(res&&res.ok){done();} else {fail();} })
        .catch(fail);
      function fail(){btn.disabled=false;btn.textContent="Send my plan";note.textContent="Something went wrong — please try again, or message me on WhatsApp.";}
    }
    render();
  })();
  </script>
</body>
</html>
