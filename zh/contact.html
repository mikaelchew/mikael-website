    <div class="contact-grid">
      <div>
        <form class="form" id="contact-form" action="https://formspree.io/f/xreojdqa" method="POST" data-ajax>
          <label for="name" data-en="Name" data-zh="姓名">姓名</label>
          <input type="text" id="name" name="name" placeholder="你的全名" data-en="Your full name" data-zh="你的全名" autocomplete="name" required>
          <label for="email" data-en="Email" data-zh="電子郵件">電子郵件</label>
          <input type="email" id="email" name="email" placeholder="你的電子郵件地址" data-en="Your email address" data-zh="你的電子郵件地址" autocomplete="email" required>
          <label for="subject" data-en="Subject" data-zh="主題">主題</label>
          <select id="subject" name="subject" required>
            <option value="" disabled selected data-en="Select a subject" data-zh="選擇主題">選擇主題</option>
            <option value="General Inquiry" data-en="General Inquiry" data-zh="一般諮詢">一般諮詢</option>
            <option value="Speaking Engagement" data-en="Speaking Engagement" data-zh="演講邀約">演講邀約</option>
            <option value="Mentorship Inquiry" data-en="Mentorship Inquiry" data-zh="指導諮詢">指導諮詢</option>
            <option value="Media &amp; Press" data-en="Media &amp; Press" data-zh="媒體與新聞">媒體與新聞</option>
            <option value="Other" data-en="Other" data-zh="其他">其他</option>
          </select>
          <label for="message" data-en="Message" data-zh="訊息">訊息</label>
          <textarea id="message" name="message" placeholder="告訴我你想聊什麼..." data-en="Tell me how I can help..." data-zh="告訴我你想聊什麼..." required></textarea>
          <button type="submit" class="btn" data-en="Send message" data-zh="發送訊息">發送訊息</button>
        </form>
        <p class="form-ok" tabindex="-1" hidden data-en="Message sent. Thank you for reaching out; I'll get back to you soon." data-zh="訊息已發送。感謝你的來信，我會盡快回覆你。">訊息已發送。感謝你的來信，我會盡快回覆你。</p>
      </div>
